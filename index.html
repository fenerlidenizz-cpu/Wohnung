<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsere Wohnung – Galerie</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7d6a55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="https://img.icons8.com/isometric-line/512/armchair.png">

<meta property="og:description" content="Möbel, Favoriten & Budget-Planung">

<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --ink:#1c1b19; --muted:#78736c;
    --line:#e6e2dc; --accent:#7d6a55; --warn:#a8443a; --fav:#e5a11c;
    --accent-light: #f1ece4; --shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161513; --card:#201f1c; --ink:#f2efea; --muted:#9c968d;
           --line:#332f2a; --accent:#c4a882; --warn:#e08b80; --fav:#f5b73d;
           --accent-light: #2c2720; --shadow: 0 4px 16px rgba(0,0,0,0.4); }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px 100px;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  
  header{
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center;
    margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
  }
  h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;max-width:60ch;margin:0}
  
  .header-controls{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }

  .grid-switcher {
    display: inline-flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .grid-switcher button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .grid-switcher button.active {
    background: var(--accent);
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }

  .addbtn{
    flex-shrink:0;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:9px 15px;font-size:13px;font-weight:650;cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.10);transition:transform .12s ease, opacity .12s ease;
  }
  .addbtn:hover{transform:translateY(-1px);opacity:.92}

  .cart-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 800;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 50px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 650;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.22);
    backdrop-filter: blur(8px);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .cart-btn:hover {
    background: var(--accent-light);
    transform: translateY(-2px);
  }
  .cart-badge {
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 700;
  }

  h2{
    margin:32px 0 12px;font-size:13px;font-weight:650;
    letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
    border-bottom:1px solid var(--line);padding-bottom:6px;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .cat-title-wrap{display:flex;align-items:center;gap:6px}
  .cat-edit-btn{
    background:none;border:none;cursor:pointer;font-size:12px;padding:2px 5px;
    border-radius:4px;color:var(--muted);transition:color .12s ease;
  }
  .cat-edit-btn:hover{color:var(--ink);background:var(--line)}
  .cat-stats { display: flex; gap: 10px; font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .cat-stats strong { color: var(--ink); }

  .grid { display: grid; gap: 12px; }
  .grid-cols-1 { grid-template-columns: 1fr; }
  .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
  
  @media (min-width: 900px) {
    .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 1250px) {
    .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-cols-4 { grid-template-columns: repeat(5, 1fr); }
  }

  .cardwrap{position:relative}
  .card{
    display:flex;flex-direction:column;height:100%;background:var(--card);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;
    color:inherit;transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .card.selected{border-color:var(--accent);background:var(--accent-light)}
  
  .thumb{
    position:relative;aspect-ratio:1/1;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;padding:6px}
  .noimg{
    color:var(--muted);font-size:11px;text-align:center;padding:12px;line-height:1.35;
    background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(125,106,85,.05) 8px,rgba(125,106,85,.05) 16px);
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  }
  .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex-grow:1}
  .name{font-size:12px;font-weight:580;line-height:1.3;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .name:hover { color: var(--accent); text-decoration: underline; }
  
  .card-footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 4px; }
  .price{font-size:12.5px;font-weight:680;letter-spacing:-.01em}
  .price small{font-weight:400;color:var(--muted);text-decoration:line-through;margin-left:4px;font-size:10.5px}

  .select-toggle {
    display: flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer; user-select: none; color: var(--muted);
  }
  .select-toggle input { accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; }

  .badge{
    position:absolute;top:6px;left:6px;background:var(--warn);color:#fff;
    font-size:9px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;
    padding:2px 5px;border-radius:4px; z-index: 2;
  }
  .fav-btn{
    position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);
    border:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;cursor:pointer;font-size:12px;color:#fff;transition:transform .15s, background .15s; z-index: 2;
  }
  .fav-btn:hover{transform:scale(1.1)}
  .fav-btn.active{background:#fff;color:var(--fav);box-shadow:0 2px 6px rgba(0,0,0,0.2)}

  .drawer-overlay{
    position:fixed;inset:0;background:rgba(20,18,15,.5);display:none;
    z-index:900;opacity:0;transition:opacity 0.3s ease;
  }
  .drawer-overlay.open{display:block;opacity:1}
  .drawer{
    position:fixed;top:0;right:-420px;width:100%;max-width:380px;height:100%;
    background:var(--card);box-shadow:-4px 0 24px rgba(0,0,0,0.15);z-index:1000;
    display:flex;flex-direction:column;transition:right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .drawer.open{right:0}
  .drawer-header{
    padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  }
  .drawer-header h3{margin:0;font-size:16px;font-weight:650}
  .drawer-body{padding:16px;overflow-y:auto;flex-grow:1;display:flex;flex-direction:column;gap:8px}
  .drawer-item{
    display:flex;justify-content:space-between;align-items:center;padding:8px 10px;
    background:var(--bg);border-radius:6px;font-size:12px;border:1px solid var(--line);
  }
  .drawer-item-title{font-weight:600;color:var(--ink);text-decoration:none}
  .drawer-item-title:hover{text-decoration:underline;color:var(--accent)}
  .drawer-item-cat{font-size:10px;color:var(--muted)}
  .drawer-item-price{font-weight:700;white-space:nowrap;margin-left:8px}
  .drawer-footer{padding:16px;border-top:1px solid var(--line);background:var(--bg)}
  .total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:700}

  footer{margin:48px auto 0;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:14px}

  .overlay{
    position:fixed;inset:0;background:rgba(20,18,15,.5);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:1100;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--card);border-radius:12px;max-width:480px;width:100%;
    padding:20px;box-shadow:0 16px 48px rgba(0,0,0,.25);max-height:90vh;overflow:auto;
  }
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:650}
  .modal-preview{
    width:100%;height:120px;object-fit:contain;background:#fff;border-radius:6px;
    margin-bottom:12px;border:1px solid var(--line);
  }
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;font-weight:650;color:var(--muted);margin-bottom:4px;
    text-transform:uppercase;letter-spacing:.04em}
  .field input, .field select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);font-size:13px;font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  
  .url-input-group{display:flex;gap:6px}
  .fetch-btn{
    flex-shrink:0;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    padding:0 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .fetch-btn:hover{background:var(--line)}
  
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modalbtns{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;flex-wrap:wrap}
  .modalbtns-right{display:flex;gap:8px}
  .btn{padding:8px 14px;border-radius:7px;border:none;font-size:13px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
  .btn.shoplink{background:#2a2825;color:#fff}
  .empty{color:var(--muted);font-size:13px;padding:20px 0}
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1 id="pageHeading">Unsere Wohnung – Galerie</h1>
      <p class="sub" id="subHeading">Live synchronisiert. Alle Änderungen sind sofort auf allen Geräten sichtbar.</p>
    </div>
    
    <div class="header-controls">
      <div class="grid-switcher" title="Kachelgröße anpassen">
        <button id="btnGrid1" onclick="setGridCols(1)">1</button>
        <button id="btnGrid2" onclick="setGridCols(2)">2</button>
        <button id="btnGrid3" onclick="setGridCols(3)">3</button>
        <button id="btnGrid4" onclick="setGridCols(4)">4</button>
      </div>

      <button class="addbtn" onclick="openAddModal()">+ Produkt hinzufügen</button>
    </div>
  </header>

  <button class="cart-btn" onclick="toggleDrawer()">
    🛒 Budget & Auswahl
    <span class="cart-badge" id="cart-badge">0</span>
    <span id="cart-btn-total">0,00 €</span>
  </button>

  <div id="content"><p class="empty">Lade Produkte...</p></div>
  <footer id="footer"></footer>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h3>Ausgewählte Produkte</h3>
    <button class="cat-edit-btn" onclick="toggleDrawer()" style="font-size:16px">✕</button>
  </div>
  <div class="drawer-body" id="drawerItems"></div>
  <div class="drawer-footer">
    <div class="total-row">
      <span>Gesamtsumme:</span>
      <span id="drawerTotal">0,00 €</span>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Produkt bearbeiten</h3>
    <img id="modalImgPreview" class="modal-preview" src="" alt="Vorschau" style="display:none">
    
    <form id="productForm">
      <input type="hidden" id="f_id">
      
      <div class="field">
        <label>Link zum Shop</label>
        <div class="url-input-group">
          <input type="url" id="f_url" required placeholder="https://..." onpaste="handleUrlPaste(event)">
          <button type="button" class="fetch-btn" id="btnAutoFetch" onclick="fetchProductData()">✨ Abrufen</button>
        </div>
      </div>

      <div class="field">
        <label>Kategorie *</label>
        <select id="f_category" required></select>
      </div>
      <div class="field" id="newCatField" style="display:none">
        <label>Name der neuen Kategorie *</label>
        <input type="text" id="f_newCategory" placeholder="z. B. Balkon, Flur">
      </div>

      <div class="field">
        <label>Produktname *</label>
        <input type="text" id="f_name" required placeholder="z. B. IKEA MALM Kommode">
      </div>

      <div class="field">
        <label>Bild-URL (optional)</label>
        <input type="url" id="f_img" placeholder="https://..." oninput="updatePreview(this.value)">
      </div>

      <div class="row2">
        <div class="field">
          <label>Preis</label>
          <input type="text" id="f_price" placeholder="z. B. 199,00 €">
        </div>
        <div class="field">
          <label>Alter Preis (optional)</label>
          <input type="text" id="f_oldPrice" placeholder="z. B. 249 €">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Badge (optional)</label>
          <input type="text" id="f_badge" placeholder="z. B. ausverkauft">
        </div>
      </div>

      <div class="modalbtns">
        <div>
          <button type="button" class="btn danger" id="btnDelete" onclick="deleteCurrentProduct()" style="display:none">Löschen</button>
        </div>
        <div class="modalbtns-right">
          <a href="#" target="_blank" rel="noopener" class="btn shoplink" id="btnShopLink" style="display:none">Zum Shop ↗</a>
          <button type="button" class="btn ghost" onclick="closeModal()">Schließen</button>
          <button type="submit" class="btn primary" id="btnSubmit">Speichern</button>
        </div>
      </div>
    </form>
  </div>
</div>

const urlParams = new URLSearchParams(window.location.search);
const listId = urlParams.get('wg') || 'standard';
const currentUser = urlParams.get('user') || 'standard';
const userStorageKey = `wohnung_user_state_${listId}_${currentUser}`;

if(listId !== 'standard'){
  document.getElementById('pageHeading').textContent = `Wohnungsgalerie (${listId})`;
  document.title = `Wohnungsgalerie – ${listId}`;
}

if(currentUser !== 'standard'){
  document.getElementById('subHeading').innerHTML = `Profil von <strong>${currentUser.toUpperCase()}</strong> – Live synchronisiert.`;
}

let currentGridCols = parseInt(localStorage.getItem('wohnung_grid_cols') || '3', 10);

function setGridCols(cols) {
  currentGridCols = cols;
  localStorage.setItem('wohnung_grid_cols', cols);
  updateGridButtons();
  render();
}

function updateGridButtons() {
  [1, 2, 3, 4].forEach(n => {
    const btn = document.getElementById(`btnGrid${n}`);
    if(btn) {
      if(n === currentGridCols) btn.classList.add('active');
      else btn.classList.remove('active');
    }
  });
}

const STORAGE_ENDPOINT = `${DB_URL}/lists/${encodeURIComponent(listId)}.json`;

let products = [];
let nextId = 1;
let isModalOpen = false; // Verhindert Render-Abbruch während der Eingabe

let userState = {};
try {
  userState = JSON.parse(localStorage.getItem(userStorageKey)) || {};
} catch(e) { userState = {}; }

function saveUserState() {
  localStorage.setItem(userStorageKey, JSON.stringify(userState));
}

// Background Sync (Polling) ohne Reloading
async function syncFromCloud(silent = false){
  try {
    const res = await fetch(STORAGE_ENDPOINT);
    const data = await res.json();
    let incoming = [];
    if(data && Array.isArray(data) && data.length){
      incoming = data.filter(Boolean);
    } else if(listId === 'standard' && !silent) {
      incoming = SEED_PRODUCTS;
      await saveProducts();
    }

    const currentHash = JSON.stringify(products);
    const newHash = JSON.stringify(incoming);

    if (currentHash !== newHash && incoming.length > 0) {
      products = incoming;
      nextId = products.reduce((m,p)=>Math.max(m,p.id||0),0) + 1;
      
      // Nur aktualisieren, wenn der Nutzer gerade NICHT im Modal editiert
      if(!isModalOpen) {
        render();
      }
    }
  } catch(e) {
    if(!silent) products = listId === 'standard' ? SEED_PRODUCTS : [];
  }
}

async function loadProducts(){
  await syncFromCloud(false);
  updateGridButtons();
  render();

  // Hintergrund-Synchronisierung alle 5 Sekunden
  setInterval(() => {
    syncFromCloud(true);
  }, 5000);
}

async function saveProducts(){
  try {
    await fetch(STORAGE_ENDPOINT, {
      method: 'PUT',
      body: JSON.stringify(products)
    });
  } catch(e) {
    console.error('Cloud Sync fehlgeschlagen', e);
  }
}

function updatePreview(url){
  const preview = document.getElementById('modalImgPreview');
  if(url && url.startsWith('http')){
    preview.src = url;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

function handleUrlPaste(e){
  setTimeout(() => { fetchProductData(); }, 100);
}

async function fetchProductData(){
  const url = document.getElementById('f_url').value.trim();
  if(!url || !url.startsWith('http')) return;
  if(PROXY_URL.includes("DEINE_ID")) return;

  const btn = document.getElementById('btnAutoFetch');
  btn.textContent = '⏳ Lädt...';
  btn.disabled = true;

  try {
    const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    
    if(data.title && !document.getElementById('f_name').value){
      document.getElementById('f_name').value = data.title;
    }
    if(data.image && !document.getElementById('f_img').value){
      document.getElementById('f_img').value = data.image;
      updatePreview(data.image);
    }
    if(data.price && !document.getElementById('f_price').value){
      document.getElementById('f_price').value = data.price;
    }
  } catch(err) {
    console.error("Scraping-Fehler", err);
  } finally {
    btn.textContent = '✨ Abrufen';
    btn.disabled = false;
  }
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parsePrice(priceStr) {
  if (!priceStr) return 0;
  let clean = priceStr.replace(/[^0-9,.-]/g, '');
  if (clean.includes(',') && clean.includes('.')) {
    clean = clean.replace(/\./g, '').replace(',', '.');
  } else if (clean.includes(',')) {
    clean = clean.replace(',', '.');
  }
  const val = parseFloat(clean);
  return isNaN(val) ? 0 : val;
}

function formatEuro(num) {
  return num.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
}

function render(){
  const content = document.getElementById('content');
  if(products.length === 0){
    content.innerHTML = '<p class="empty">Noch keine Produkte in dieser Liste. Klicke oben auf "+ Produkt hinzufügen".</p>';
    document.getElementById('footer').textContent = '';
    updateSummary();
    return;
  }

  const categories = [];
  for(const p of products){
    if(p.category && !categories.includes(p.category)) categories.push(p.category);
  }

  let html = '';
  for(const cat of categories){
    const items = products.filter(p => p.category === cat);
    
    let catSelectedTotal = 0;
    items.forEach(p => {
      const state = userState[p.id] || { selected: false };
      if(state.selected) catSelectedTotal += parsePrice(p.price);
    });

    html += `<h2>
      <span class="cat-title-wrap">
        <span>${escapeHtml(cat)}</span>
        <button class="cat-edit-btn" onclick="renameCategory('${escapeHtml(cat)}')" title="Kategorie umbenennen">✏️</button>
      </span>
      <span class="cat-stats">
        <span>${items.length} ${items.length===1?'Produkt':'Produkte'}</span>
        <span>Ausgewählt: <strong>${formatEuro(catSelectedTotal)}</strong></span>
      </span>
    </h2>`;

    html += `<div class="grid grid-cols-${currentGridCols}">`;
    for(const p of items){
      const state = userState[p.id] || { selected: false, favorite: false };
      const isSelected = state.selected;
      const isFav = state.favorite;

      html += '<div class="cardwrap">';
      html += `<div class="card ${isSelected ? 'selected' : ''}" id="card-${p.id}">`;
      
      html += '<div class="thumb" onclick="openEditModal(' + p.id + ')">';
      if(p.badge) html += `<span class="badge">${escapeHtml(p.badge)}</span>`;
      html += `<button class="fav-btn ${isFav ? 'active' : ''}" title="Favorit" onclick="event.stopPropagation(); toggleFav(${p.id})">★</button>`;
      
      if(p.img){
        html += `<img loading="lazy" src="${escapeHtml(p.img)}" alt="">`;
      } else {
        html += `<div class="noimg">${escapeHtml(p.noimg || 'Kein Bild hinterlegt')}</div>`;
      }
      html += '</div>';

      html += '<div class="meta">';
      html += `<span class="name" onclick="openEditModal(${p.id})">${escapeHtml(p.name)}</span>`;
      
      html += '<div class="card-footer-row">';
      html += `<span class="price">${escapeHtml(p.price)}`;
      if(p.oldPrice) html += `<small>${escapeHtml(p.oldPrice)}</small>`;
      html += '</span>';

      html += `<label class="select-toggle" onclick="event.stopPropagation()">`;
      html += `<input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect(${p.id})"> Ausw.`;
      html += `</label>`;

      html += '</div></div></div></div>';
    }
    html += '</div>';
  }
  content.innerHTML = html;
  
  document.getElementById('footer').textContent = `${products.length} Produkte in ${categories.length} Kategorien.`;
  updateSummary();
}

function toggleSelect(id) {
  if(!userState[id]) userState[id] = { selected: false, favorite: false };
  userState[id].selected = !userState[id].selected;
  saveUserState();
  render();
}

function toggleFav(id) {
  if(!userState[id]) userState[id] = { selected: false, favorite: false };
  userState[id].favorite = !userState[id].favorite;
  saveUserState();
  render();
}

function updateSummary() {
  let total = 0;
  let count = 0;
  let drawerHtml = '';

  products.forEach(p => {
    const state = userState[p.id];
    if(state && state.selected) {
      count++;
      const pVal = parsePrice(p.price);
      total += pVal;
      
      drawerHtml += `
        <div class="drawer-item">
          <div>
            <a href="${p.url || '#'}" target="_blank" rel="noopener" class="drawer-item-title">${state.favorite ? '★ ' : ''}${escapeHtml(p.name)} ↗</a>
            <div class="drawer-item-cat">${escapeHtml(p.category)}</div>
          </div>
          <div class="drawer-item-price">${escapeHtml(p.price)}</div>
        </div>
      `;
    }
  });

  document.getElementById('cart-badge').textContent = count;
  document.getElementById('cart-btn-total').textContent = formatEuro(total);
  document.getElementById('drawerTotal').textContent = formatEuro(total);

  const drawerItems = document.getElementById('drawerItems');
  if(count === 0) {
    drawerItems.innerHTML = '<div style="color:var(--muted); text-align:center; margin-top:40px;">Noch keine Produkte ausgewählt.</div>';
  } else {
    drawerItems.innerHTML = drawerHtml;
  }
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawerOverlay').classList.toggle('open');
}

async function renameCategory(oldName){
  const newName = prompt(`Kategorie "${oldName}" umbenennen in:`, oldName);
  if(!newName || newName.trim() === '' || newName.trim() === oldName) return;

  const trimmed = newName.trim();
  products = products.map(p => {
    if(p.category === oldName){
      return { ...p, category: trimmed };
    }
    return p;
  });

  render();
  await saveProducts();
}

function populateCategorySelect(selectedCategory = ''){
  const sel = document.getElementById('f_category');
  const categories = [];
  for(const p of products){
    if(p.category && !categories.includes(p.category)) categories.push(p.category);
  }
  sel.innerHTML = '';
  
  const placeholderOpt = document.createElement('option');
  placeholderOpt.value = '';
  placeholderOpt.textContent = '-- Bitte Kategorie wählen --';
  placeholderOpt.disabled = true;
  if (!selectedCategory) placeholderOpt.selected = true;
  sel.appendChild(placeholderOpt);

  for(const c of categories){
    const opt = document.createElement('option');
    opt.value = c; 
    opt.textContent = c;
    if(c === selectedCategory) opt.selected = true;
    sel.appendChild(opt);
  }
  const newOpt = document.createElement('option');
  newOpt.value = '__new__'; 
  newOpt.textContent = '+ Neue Kategorie erstellen...';
  sel.appendChild(newOpt);
  
  sel.onchange = () => {
    const isNew = sel.value === '__new__';
    const newField = document.getElementById('newCatField');
    const newInp = document.getElementById('f_newCategory');
    newField.style.display = isNew ? 'block' : 'none';
    newInp.required = isNew;
  };
}

function openAddModal(){
  isModalOpen = true;
  populateCategorySelect('');
  document.getElementById('productForm').reset();
  document.getElementById('f_id').value = '';
  document.getElementById('f_newCategory').required = false;
  document.getElementById('modalTitle').textContent = 'Neues Produkt hinzufügen';
  document.getElementById('btnSubmit').textContent = 'Hinzufügen';
  document.getElementById('btnDelete').style.display = 'none';
  document.getElementById('btnShopLink').style.display = 'none';
  document.getElementById('modalImgPreview').style.display = 'none';
  document.getElementById('newCatField').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
}

function openEditModal(id){
  const p = products.find(item => item.id === id);
  if(!p) return;
  isModalOpen = true;
  populateCategorySelect(p.category);
  document.getElementById('productForm').reset();
  document.getElementById('f_id').value = p.id;
  document.getElementById('f_newCategory').required = false;
  document.getElementById('modalTitle').textContent = 'Produkt bearbeiten';
  document.getElementById('btnSubmit').textContent = 'Speichern';
  document.getElementById('btnDelete').style.display = 'inline-flex';
  
  const shopBtn = document.getElementById('btnShopLink');
  shopBtn.style.display = 'inline-flex';
  shopBtn.href = p.url;

  updatePreview(p.img);

  document.getElementById('f_name').value = p.name || '';
  document.getElementById('f_url').value = p.url || '';
  document.getElementById('f_img').value = p.img || '';
  document.getElementById('f_price').value = p.price || '';
  document.getElementById('f_oldPrice').value = p.oldPrice || '';
  document.getElementById('f_badge').value = p.badge || '';
  document.getElementById('newCatField').style.display = 'none';

  document.getElementById('overlay').classList.add('open');
}

function closeModal(){
  isModalOpen = false;
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const catSel = document.getElementById('f_category').value;
  
  if(!catSel) {
    alert('Bitte wähle eine Kategorie aus.');
    return;
  }

  const category = catSel === '__new__'
    ? (document.getElementById('f_newCategory').value.trim() || 'Sonstiges')
    : catSel;
  const idVal = document.getElementById('f_id').value;

  const productData = {
    category,
    name: document.getElementById('f_name').value.trim(),
    url: document.getElementById('f_url').value.trim(),
    img: document.getElementById('f_img').value.trim(),
    noimg: '',
    price: document.getElementById('f_price').value.trim(),
    oldPrice: document.getElementById('f_oldPrice').value.trim(),
    badge: document.getElementById('f_badge').value.trim(),
  };

  if(idVal){
    const idx = products.findIndex(p => p.id === parseInt(idVal, 10));
    if(idx !== -1){
      products[idx] = { ...products[idx], ...productData };
    }
  } else {
    productData.id = nextId++;
    products.push(productData);
    if(!userState[productData.id]) userState[productData.id] = { selected: true, favorite: false };
    saveUserState();
  }

  render();
  closeModal();
  await saveProducts();
});

async function deleteCurrentProduct(){
  const idVal = document.getElementById('f_id').value;
  if(!idVal) return;
  if(!confirm('Dieses Produkt wirklich entfernen?')) return;
  products = products.filter(p => p.id !== parseInt(idVal, 10));
  render();
  closeModal();
  await saveProducts();
}

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Fehler:', err));
  });

  e.preventDefault();
  deferredPrompt = e;
});

// Shared Link Erkennung
window.addEventListener('DOMContentLoaded', () => {
  const sharedUrl = urlParams.get('share_url') || urlParams.get('share_text') || '';
  const sharedTitle = urlParams.get('share_title') || '';

  if (sharedUrl) {
    let finalUrl = sharedUrl;
    const urlMatch = sharedUrl.match(/https?:\/\/[^\s]+/);
    if (urlMatch) {
      finalUrl = urlMatch[0];
    }

    openAddModal();
    document.getElementById('f_url').value = finalUrl;
    if (sharedTitle) {
      document.getElementById('f_name').value = sharedTitle;
    }
    setTimeout(() => { fetchProductData(); }, 300);
  }
});

loadProducts();
