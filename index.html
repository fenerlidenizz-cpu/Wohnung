<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsere Wohnung – Galerie</title>
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --ink:#1c1b19; --muted:#78736c;
    --line:#e6e2dc; --accent:#7d6a55; --warn:#a8443a; --fav:#e5a11c;
    --accent-light: #f1ece4; --shadow: 0 8px 24px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161513; --card:#201f1c; --ink:#f2efea; --muted:#9c968d;
           --line:#332f2a; --accent:#c4a882; --warn:#e08b80; --fav:#f5b73d;
           --accent-light: #2c2720; --shadow: 0 8px 24px rgba(0,0,0,0.4); }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:32px 20px 64px;
  }
  header{max-width:1200px;margin:0 auto 40px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
  h1{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:0 0 8px}
  .sub{color:var(--muted);font-size:14px;max-width:60ch;margin:0}
  .btn-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .addbtn{
    flex-shrink:0;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px 18px;font-size:14px;font-weight:650;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .12s ease, opacity .12s ease;
  }
  .addbtn:hover{transform:translateY(-1px);opacity:.92}

  /* WARENKORB / BUDGET BUTTON */
  .cart-btn {
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 18px; font-size: 14px; font-weight: 650; cursor: pointer; display: flex;
    align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.04); transition: background 0.2s;
  }
  .cart-btn:hover { background: var(--accent-light); }
  .cart-badge {
    background: var(--accent); color: #fff; border-radius: 50%; padding: 2px 7px; font-size: 11px; font-weight: 700;
  }

  h2{
    max-width:1200px;margin:48px auto 16px;font-size:14px;font-weight:650;
    letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
    border-bottom:1px solid var(--line);padding-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .cat-title-wrap{display:flex;align-items:center;gap:8px}
  .cat-edit-btn{
    background:none;border:none;cursor:pointer;font-size:13px;padding:2px 6px;
    border-radius:4px;color:var(--muted);transition:color .12s ease, background .12s ease;
  }
  .cat-edit-btn:hover{color:var(--ink);background:var(--line)}
  .cat-stats { display: flex; gap: 12px; font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .cat-stats strong { color: var(--ink); }

  .grid{
    max-width:1200px;margin:0 auto;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  }
  .cardwrap{position:relative}
  .card{
    display:flex;flex-direction:column;height:100%;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    color:inherit;transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.10)}
  .card.selected{border-color:var(--accent);background:var(--accent-light)}
  
  .thumb{
    position:relative;aspect-ratio:1/1;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;padding:8px}
  .noimg{
    color:var(--muted);font-size:12px;text-align:center;padding:16px;line-height:1.45;
    background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(125,106,85,.05) 8px,rgba(125,106,85,.05) 16px);
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  }
  .meta{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px;flex-grow:1}
  .name{font-size:13px;font-weight:560;line-height:1.35;cursor:pointer}
  .name:hover { color: var(--accent); text-decoration: underline; }
  
  .card-footer-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 6px; }
  .price{font-size:14px;font-weight:680;letter-spacing:-.01em}
  .price small{font-weight:400;color:var(--muted);text-decoration:line-through;margin-left:5px;font-size:12px}

  .select-toggle {
    display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; color: var(--muted);
  }
  .select-toggle input { accent-color: var(--accent); cursor: pointer; width: 15px; height: 15px; }

  .badge{
    position:absolute;top:8px;left:8px;background:var(--warn);color:#fff;
    font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 7px;border-radius:5px; z-index: 2;
  }
  .fav-btn{
    position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);
    border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;cursor:pointer;font-size:14px;color:#fff;transition:transform .15s, background .15s; z-index: 2;
  }
  .fav-btn:hover{transform:scale(1.1)}
  .fav-btn.active{background:#fff;color:var(--fav);box-shadow:0 2px 8px rgba(0,0,0,0.2)}

  /* SLIDE-OUT DRAWER (Warenkorb / Budget Übersicht) */
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(20,18,15,.5);display:none;
    z-index:900;opacity:0;transition:opacity 0.3s ease;
  }
  .drawer-overlay.open{display:block;opacity:1}
  .drawer{
    position:fixed;top:0;right:-420px;width:100%;max-width:400px;height:100%;
    background:var(--card);box-shadow:-4px 0 24px rgba(0,0,0,0.15);z-index:1000;
    display:flex;flex-direction:column;transition:right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .drawer.open{right:0}
  .drawer-header{
    padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  }
  .drawer-header h3{margin:0;font-size:18px;font-weight:650}
  .drawer-body{padding:20px;overflow-y:auto;flex-grow:1;display:flex;flex-direction:column;gap:10px}
  .drawer-item{
    display:flex;justify-content:space-between;align-items:center;padding:10px;
    background:var(--bg);border-radius:8px;font-size:13px;border:1px solid var(--line);
  }
  .drawer-item-title{font-weight:600;color:var(--ink);text-decoration:none}
  .drawer-item-title:hover{text-decoration:underline;color:var(--accent)}
  .drawer-item-cat{font-size:11px;color:var(--muted)}
  .drawer-item-price{font-weight:700;white-space:nowrap;margin-left:12px}
  .drawer-footer{padding:20px;border-top:1px solid var(--line);background:var(--bg)}
  .total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:700}

  footer{max-width:1200px;margin:56px auto 0;color:var(--muted);font-size:12px;
    border-top:1px solid var(--line);padding-top:16px}

  .overlay{
    position:fixed;inset:0;background:rgba(20,18,15,.5);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:1100;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--card);border-radius:14px;max-width:520px;width:100%;
    padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto;
  }
  .modal h3{margin:0 0 18px;font-size:18px;font-weight:650}
  .modal-preview{
    width:100%;height:140px;object-fit:contain;background:#fff;border-radius:8px;
    margin-bottom:16px;border:1px solid var(--line);
  }
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.04em}
  .field input, .field select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  
  .url-input-group{display:flex;gap:8px}
  .fetch-btn{
    flex-shrink:0;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    transition:background .12s ease;
  }
  .fetch-btn:hover{background:var(--line)}
  
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modalbtns{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
  .modalbtns-right{display:flex;gap:10px}
  .btn{padding:10px 18px;border-radius:9px;border:none;font-size:14px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
  .btn.shoplink{background:#2a2825;color:#fff}
  .empty{max-width:1200px;margin:0 auto;color:var(--muted);font-size:14px;padding:20px 0}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="pageHeading">Unsere Wohnung – Galerie</h1>
    <p class="sub" id="subHeading">Live synchronisiert. Alle Änderungen sind sofort auf allen Geräten sichtbar.</p>
  </div>
  <div class="btn-bar">
    <button class="cart-btn" onclick="toggleDrawer()">
      🛒 Übersicht & Budget
      <span class="cart-badge" id="cart-badge">0</span>
      <span id="cart-btn-total">0,00 €</span>
    </button>
    <button class="addbtn" onclick="openAddModal()">+ Produkt hinzufügen</button>
  </div>
</header>

<div id="content"><p class="empty">Lade Produkte...</p></div>
<footer id="footer"></footer>

<!-- AUSKLAPP-FELD (WARENKORB / BUDGET) -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h3>Ausgewählte Produkte</h3>
    <button class="cat-edit-btn" onclick="toggleDrawer()" style="font-size:18px">✕</button>
  </div>
  <div class="drawer-body" id="drawerItems"></div>
  <div class="drawer-footer">
    <div class="total-row">
      <span>Gesamtsumme:</span>
      <span id="drawerTotal">0,00 €</span>
    </div>
  </div>
</div>

<!-- MODAL FÜR BEARBEITUNG / ERSTELLUNG -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Produkt bearbeiten</h3>
    <img id="modalImgPreview" class="modal-preview" src="" alt="Vorschau" style="display:none">
    
    <form id="productForm">
      <input type="hidden" id="f_id">
      
      <div class="field">
        <label>Link zum Shop</label>
        <div class="url-input-group">
          <input type="url" id="f_url" required placeholder="https://..." onpaste="handleUrlPaste(event)">
          <button type="button" class="fetch-btn" id="btnAutoFetch" onclick="fetchProductData()">✨ Abrufen</button>
        </div>
      </div>

      <div class="field">
        <label>Kategorie</label>
        <select id="f_category"></select>
      </div>
      <div class="field" id="newCatField" style="display:none">
        <label>Name der neuen Kategorie</label>
        <input type="text" id="f_newCategory" placeholder="z. B. Balkon, Flur">
      </div>

      <div class="field">
        <label>Produktname</label>
        <input type="text" id="f_name" required placeholder="z. B. IKEA MALM Kommode">
      </div>

      <div class="field">
        <label>Bild-URL (optional)</label>
        <input type="url" id="f_img" placeholder="https://..." oninput="updatePreview(this.value)">
      </div>

      <div class="row2">
        <div class="field">
          <label>Preis</label>
          <input type="text" id="f_price" placeholder="z. B. 199,00 €">
        </div>
        <div class="field">
          <label>Alter Preis (optional)</label>
          <input type="text" id="f_oldPrice" placeholder="z. B. 249 €">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Badge (optional)</label>
          <input type="text" id="f_badge" placeholder="z. B. ausverkauft">
        </div>
      </div>

      <div class="modalbtns">
        <div>
          <button type="button" class="btn danger" id="btnDelete" onclick="deleteCurrentProduct()" style="display:none">Löschen</button>
        </div>
        <div class="modalbtns-right">
          <a href="#" target="_blank" rel="noopener" class="btn shoplink" id="btnShopLink" style="display:none">Zum Shop ↗</a>
          <button type="button" class="btn ghost" onclick="closeModal()">Schließen</button>
          <button type="submit" class="btn primary" id="btnSubmit">Speichern</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
const DB_URL = "https://wohnung-einrichtung-default-rtdb.firebaseio.com";
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyWqG-kLwHZZ_wA7l1fA3o-eYqYl_DEINE_ID/exec"; 

const SEED_PRODUCTS = [
  {"category":"Schlafzimmer · Bett (4 Kandidaten)","url":"https://www.xxxlutz.de/p/chameo-polsterbett-180-200-cm-in-beige-gepolstertes-kopfteil-lattenrost-bettkasten-002330009701","img":"https://media.xxxlutz.com/i/xxxlutz/PIlPZpsW3cZ117oikyQpa_Bw/?fmt=auto&w=600","noimg":"","badge":"","name":"CHAMEO Polsterbett · XXXLutz","price":"791,28 €","oldPrice":"1.099 €","id":1},
  {"category":"Schlafzimmer · Bett (4 Kandidaten)","url":"https://www.otto.de/p/moeblo-polsterbett-aus-boucle-bett-06-bezug-boucle-doppelbett-mit-kopfstuetze-rahmenbettgestell-mit-bettkasten-und-lattenrost-gepolstertes-kopfteil-S0LBH0AZ/","img":"https://i.otto.de/i/otto/9154705f-ad98-4c92-8ab8-7795f3d93d72/moeblo-polsterbett-aus-boucle-bett-06-bezug-boucle-doppelbett-mit-kopfstutze-rahmenbettgestell-mit-bettkasten-und-lattenrost-gepolstertes-kopfteil-creme-anthology-20.jpg?$formatz$","noimg":"","badge":"","name":"MOEBLO Bouclé „Bett 06\"","price":"679,00 €","oldPrice":"975 €","id":2},
  {"category":"Schlafzimmer · Bett (4 Kandidaten)","url":"https://www.otto.de/p/beautysofa-polsterbett-mit-bettkasten-und-rahmen-motti-140-160-oder-180cm-mit-oder-ohne-matratze-S0FDX0KL/","img":"https://i.otto.de/i/otto/f03f6c72-3561-43fa-9a7a-867469658679/beautysofa-polsterbett-mit-bettkasten-und-rahmen-motti-140-160-oder-180cm-mit-oder-ohne-matratze-creme-catchme01.jpg?$formatz$","noimg":"","badge":"","name":"Beautysofa MOTTI","price":"729,00 €","oldPrice":"1.999 €","id":3},
  {"category":"Schlafzimmer · Bett (4 Kandidaten)","url":"https://www.otto.de/p/thematys-polsterbett-mit-bettkasten-cloud-140x200-160x200-180x200-200x200cm-kopfteil-im-modernen-look-hochwertiger-boucle-stoff-inklusive-lattenrost-hochwertiger-stoff-hydraulische-klappfunktion-fuer-stauraum-S0KG10KG/","img":"https://i.otto.de/i/otto/45943c39-7a36-474d-808d-c3b83e0551b5/thematys-polsterbett-mit-bettkasten-cloud-140x200-160x200-180x200-200x200cm-kopfteil-im-modernen-look-hochwertiger-boucle-stoff-inklusive-lattenrost-hochwertiger-stoff-hydraulische-klappfunktion-fuer-stauraum-latte.jpg?$formatz$","noimg":"","badge":"","name":"thematys ALMA · Serie CLOUD","price":"859,00 €","oldPrice":"1.549 €","id":4},
  {"category":"Schlafzimmer · Matratze, Topper, Schrank","url":"https://amzn.eu/d/07purMi5","img":"https://img-www.bett1.de/unsafe/rt:fit/w:800/h:0/g:sm/plain//media/23/89/16/1738228180/bett1_bodyguard-anti-kartell-matratze_gallery-01_de.png","noimg":"","badge":"","name":"bett1 BODYGUARD Matratze 180×200","price":"479,00 €","oldPrice":"","id":5},
  {"category":"Schlafzimmer · Matratze, Topper, Schrank","url":"https://www.otto.de/p/otto-home-kleiderschrank-trento-schlafzimmerschrank-garderobe-hochglanz-in-2-unterschiedlichen-schrankhoehen-waehlbar-schrank-mit-6-tueren-und-9-schubladen-hochglanz-fronten-2-0-m-hoehe-2008696339/","img":"https://i.otto.de/i/otto/1b3fee32-cfea-50bc-ba2d-5bdce191c5b2/otto-home-kleiderschrank-trento-schlafzimmerschrank-garderobe-hochglanz-in-2-unterschiedlichen-schrankhoehen-waehlbar-schrank-mit-6-tueren-und-9-schubladen-hochglanz-fronten-2-0-m-hoehe-weiss.jpg?$formatz$","noimg":"","badge":"","name":"Kleiderschrank Trento · mit Türen","price":"599,99 €","oldPrice":"1.099,99 €","id":7},
  {"category":"Wohnzimmer","url":"https://www.otto.de/p/otto-home-highboard-malmedy-front-mit-gefraesten-rillen-kommode-midischrank-aus-massivem-kiefernholz-push-to-open-b-100-cm-1954587039/","img":"https://i.otto.de/i/otto/5213baf4-04e6-5585-a411-3a9784a3f2e7/otto-home-highboard-malmedy-front-mit-gefraesten-rillen-kommode-midischrank-aus-massivem-kiefernholz-push-to-open-b-100-cm-natur-gebeizt-gewachst-korpus-natur-gebeizt-gewachst.jpg?$formatz$","noimg":"","badge":"","name":"INOSIGN Highboard Malmedy · Kiefer","price":"399,99 €","oldPrice":"719,99 €","id":17},
  {"category":"Küche","url":"https://www.otto.de/p/smeg-kaffeevollautomat-bcc13whmeu-inkl-milchbehaelter-C1819169925/","img":"https://i.otto.de/i/otto/d47ea606-7a44-5676-9748-984dd81c0f40/smeg-kaffeevollautomat-bcc13whmeu-inkl-milchbehaelter-weiss.jpg?$formatz$","noimg":"","badge":"2,7 ★","name":"Smeg Kaffeevollautomat BCC13","price":"649,00 €","oldPrice":"799 €","id":18},
  {"category":"Arbeitszimmer, Haushalt, Renovierung","name":"TROTTEN Schreibtisch sitz/steh, weiß, 120x70 cm","url":"https://www.ikea.com/de/de/p/trotten-schreibtisch-sitz-steh-weiss-s99429578/","img":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKGBS7blzzS39NpWuxjdASMBawVBEYNzORm1e_xqeb8A&s=10","noimg":"","price":"129,00 €","oldPrice":"","badge":"nur Online","id":35}
];

const urlParams = new URLSearchParams(window.location.search);
const listId = urlParams.get('wg') || 'standard';
const currentUser = urlParams.get('user') || 'standard';
const userStorageKey = `wohnung_user_state_${listId}_${currentUser}`;

if(listId !== 'standard'){
  document.getElementById('pageHeading').textContent = `Wohnungsgalerie (${listId})`;
  document.title = `Wohnungsgalerie – ${listId}`;
}

if(currentUser !== 'standard'){
  document.getElementById('subHeading').innerHTML = `Profil von <strong>${currentUser.toUpperCase()}</strong> – Live synchronisiert.`;
}

const STORAGE_ENDPOINT = `${DB_URL}/lists/${encodeURIComponent(listId)}.json`;

let products = [];
let nextId = 1;

// Lokaler Speicher für Checkboxen und Favoriten pro User
let userState = {};
try {
  userState = JSON.parse(localStorage.getItem(userStorageKey)) || {};
} catch(e) { userState = {}; }

function saveUserState() {
  localStorage.setItem(userStorageKey, JSON.stringify(userState));
}

async function loadProducts(){
  try {
    const res = await fetch(STORAGE_ENDPOINT);
    const data = await res.json();
    if(data && Array.isArray(data) && data.length){
      products = data.filter(Boolean);
    } else if(listId === 'standard') {
      products = SEED_PRODUCTS;
      await saveProducts();
    } else {
      products = [];
    }
  } catch(e) {
    products = listId === 'standard' ? SEED_PRODUCTS : [];
  }
  nextId = products.reduce((m,p)=>Math.max(m,p.id||0),0) + 1;
  render();
}

async function saveProducts(){
  try {
    await fetch(STORAGE_ENDPOINT, {
      method: 'PUT',
      body: JSON.stringify(products)
    });
  } catch(e) {
    console.error('Cloud Sync fehlgeschlagen', e);
  }
}

function updatePreview(url){
  const preview = document.getElementById('modalImgPreview');
  if(url && url.startsWith('http')){
    preview.src = url;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

function handleUrlPaste(e){
  setTimeout(() => { fetchProductData(); }, 100);
}

async function fetchProductData(){
  const url = document.getElementById('f_url').value.trim();
  if(!url || !url.startsWith('http')) return;
  if(PROXY_URL.includes("DEINE_ID")) return;

  const btn = document.getElementById('btnAutoFetch');
  btn.textContent = '⏳ Lädt...';
  btn.disabled = true;

  try {
    const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    
    if(data.title && !document.getElementById('f_name').value){
      document.getElementById('f_name').value = data.title;
    }
    if(data.image && !document.getElementById('f_img').value){
      document.getElementById('f_img').value = data.image;
      updatePreview(data.image);
    }
    if(data.price && !document.getElementById('f_price').value){
      document.getElementById('f_price').value = data.price;
    }
  } catch(err) {
    console.error("Scraping-Fehler", err);
  } finally {
    btn.textContent = '✨ Abrufen';
    btn.disabled = false;
  }
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parsePrice(priceStr) {
  if (!priceStr) return 0;
  let clean = priceStr.replace(/[^0-9,.-]/g, '');
  if (clean.includes(',') && clean.includes('.')) {
    clean = clean.replace(/\./g, '').replace(',', '.');
  } else if (clean.includes(',')) {
    clean = clean.replace(',', '.');
  }
  const val = parseFloat(clean);
  return isNaN(val) ? 0 : val;
}

function formatEuro(num) {
  return num.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
}

function render(){
  const content = document.getElementById('content');
  if(products.length === 0){
    content.innerHTML = '<p class="empty">Noch keine Produkte in dieser Liste. Klicke oben auf "+ Produkt hinzufügen".</p>';
    document.getElementById('footer').textContent = '';
    updateSummary();
    return;
  }

  const categories = [];
  for(const p of products){
    if(p.category && !categories.includes(p.category)) categories.push(p.category);
  }

  let html = '';
  for(const cat of categories){
    const items = products.filter(p => p.category === cat);
    
    // Berechne Kategorie-Summe für ausgewählte Items
    let catSelectedTotal = 0;
    items.forEach(p => {
      const state = userState[p.id] || { selected: false };
      if(state.selected) catSelectedTotal += parsePrice(p.price);
    });

    html += `<h2>
      <span class="cat-title-wrap">
        <span>${escapeHtml(cat)}</span>
        <button class="cat-edit-btn" onclick="renameCategory('${escapeHtml(cat)}')" title="Kategorie umbenennen">✏️</button>
      </span>
      <span class="cat-stats">
        <span>${items.length} ${items.length===1?'Produkt':'Produkte'}</span>
        <span>Ausgewählt: <strong>${formatEuro(catSelectedTotal)}</strong></span>
      </span>
    </h2>`;

    html += '<div class="grid">';
    for(const p of items){
      const state = userState[p.id] || { selected: false, favorite: false };
      const isSelected = state.selected;
      const isFav = state.favorite;

      html += '<div class="cardwrap">';
      html += `<div class="card ${isSelected ? 'selected' : ''}" id="card-${p.id}">`;
      
      // Bild-Thumb / Link
      html += '<div class="thumb" onclick="openEditModal(' + p.id + ')">';
      if(p.badge) html += `<span class="badge">${escapeHtml(p.badge)}</span>`;
      html += `<button class="fav-btn ${isFav ? 'active' : ''}" title="Favorit" onclick="event.stopPropagation(); toggleFav(${p.id})">★</button>`;
      
      if(p.img){
        html += `<img loading="lazy" src="${escapeHtml(p.img)}" alt="">`;
      } else {
        html += `<div class="noimg">${escapeHtml(p.noimg || 'Kein Bild hinterlegt')}</div>`;
      }
      html += '</div>';

      // Meta info
      html += '<div class="meta">';
      html += `<span class="name" onclick="openEditModal(${p.id})">${escapeHtml(p.name)}</span>`;
      
      html += '<div class="card-footer-row">';
      html += `<span class="price">${escapeHtml(p.price)}`;
      if(p.oldPrice) html += `<small>${escapeHtml(p.oldPrice)}</small>`;
      html += '</span>';

      html += `<label class="select-toggle" onclick="event.stopPropagation()">`;
      html += `<input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect(${p.id})"> Ausw.`;
      html += `</label>`;

      html += '</div></div></div></div>';
    }
    html += '</div>';
  }
  content.innerHTML = html;
  
  document.getElementById('footer').textContent = `${products.length} Produkte in ${categories.length} Kategorien.`;
  updateSummary();
}

function toggleSelect(id) {
  if(!userState[id]) userState[id] = { selected: false, favorite: false };
  userState[id].selected = !userState[id].selected;
  saveUserState();
  render();
}

function toggleFav(id) {
  if(!userState[id]) userState[id] = { selected: false, favorite: false };
  userState[id].favorite = !userState[id].favorite;
  saveUserState();
  render();
}

function updateSummary() {
  let total = 0;
  let count = 0;
  let drawerHtml = '';

  products.forEach(p => {
    const state = userState[p.id];
    if(state && state.selected) {
      count++;
      const pVal = parsePrice(p.price);
      total += pVal;
      
      drawerHtml += `
        <div class="drawer-item">
          <div>
            <a href="${p.url || '#'}" target="_blank" rel="noopener" class="drawer-item-title">${state.favorite ? '★ ' : ''}${escapeHtml(p.name)} ↗</a>
            <div class="drawer-item-cat">${escapeHtml(p.category)}</div>
          </div>
          <div class="drawer-item-price">${escapeHtml(p.price)}</div>
        </div>
      `;
    }
  });

  document.getElementById('cart-badge').textContent = count;
  document.getElementById('cart-btn-total').textContent = formatEuro(total);
  document.getElementById('drawerTotal').textContent = formatEuro(total);

  const drawerItems = document.getElementById('drawerItems');
  if(count === 0) {
    drawerItems.innerHTML = '<div style="color:var(--muted); text-align:center; margin-top:40px;">Noch keine Produkte ausgewählt.</div>';
  } else {
    drawerItems.innerHTML = drawerHtml;
  }
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawerOverlay').classList.toggle('open');
}

async function renameCategory(oldName){
  const newName = prompt(`Kategorie "${oldName}" umbenennen in:`, oldName);
  if(!newName || newName.trim() === '' || newName.trim() === oldName) return;

  const trimmed = newName.trim();
  products = products.map(p => {
    if(p.category === oldName){
      return { ...p, category: trimmed };
    }
    return p;
  });

  render();
  await saveProducts();
}

function populateCategorySelect(selectedCategory = ''){
  const sel = document.getElementById('f_category');
  const categories = [];
  for(const p of products){
    if(p.category && !categories.includes(p.category)) categories.push(p.category);
  }
  sel.innerHTML = '';
  for(const c of categories){
    const opt = document.createElement('option');
    opt.value = c; 
    opt.textContent = c;
    if(c === selectedCategory) opt.selected = true;
    sel.appendChild(opt);
  }
  const newOpt = document.createElement('option');
  newOpt.value = '__new__'; 
  newOpt.textContent = '+ Neue Kategorie erstellen...';
  sel.appendChild(newOpt);
  
  sel.onchange = () => {
    document.getElementById('newCatField').style.display = sel.value === '__new__' ? 'block' : 'none';
  };
}

function openAddModal(){
  populateCategorySelect();
  document.getElementById('productForm').reset();
  document.getElementById('f_id').value = '';
  document.getElementById('modalTitle').textContent = 'Neues Produkt hinzufügen';
  document.getElementById('btnSubmit').textContent = 'Hinzufügen';
  document.getElementById('btnDelete').style.display = 'none';
  document.getElementById('btnShopLink').style.display = 'none';
  document.getElementById('modalImgPreview').style.display = 'none';
  document.getElementById('newCatField').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
}

function openEditModal(id){
  const p = products.find(item => item.id === id);
  if(!p) return;
  populateCategorySelect(p.category);
  document.getElementById('productForm').reset();
  document.getElementById('f_id').value = p.id;
  document.getElementById('modalTitle').textContent = 'Produkt bearbeiten';
  document.getElementById('btnSubmit').textContent = 'Speichern';
  document.getElementById('btnDelete').style.display = 'inline-flex';
  
  const shopBtn = document.getElementById('btnShopLink');
  shopBtn.style.display = 'inline-flex';
  shopBtn.href = p.url;

  updatePreview(p.img);

  document.getElementById('f_name').value = p.name || '';
  document.getElementById('f_url').value = p.url || '';
  document.getElementById('f_img').value = p.img || '';
  document.getElementById('f_price').value = p.price || '';
  document.getElementById('f_oldPrice').value = p.oldPrice || '';
  document.getElementById('f_badge').value = p.badge || '';
  document.getElementById('newCatField').style.display = 'none';

  document.getElementById('overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const catSel = document.getElementById('f_category').value;
  const category = catSel === '__new__'
    ? (document.getElementById('f_newCategory').value.trim() || 'Sonstiges')
    : catSel;
  const idVal = document.getElementById('f_id').value;

  const productData = {
    category,
    name: document.getElementById('f_name').value.trim(),
    url: document.getElementById('f_url').value.trim(),
    img: document.getElementById('f_img').value.trim(),
    noimg: '',
    price: document.getElementById('f_price').value.trim(),
    oldPrice: document.getElementById('f_oldPrice').value.trim(),
    badge: document.getElementById('f_badge').value.trim(),
  };

  if(idVal){
    const idx = products.findIndex(p => p.id === parseInt(idVal, 10));
    if(idx !== -1){
      products[idx] = { ...products[idx], ...productData };
    }
  } else {
    productData.id = nextId++;
    products.push(productData);
    // Standardmäßig neu hinzugefügte Produkte direkt auswählen
    if(!userState[productData.id]) userState[productData.id] = { selected: true, favorite: false };
    saveUserState();
  }

  render();
  closeModal();
  await saveProducts();
});

async function deleteCurrentProduct(){
  const idVal = document.getElementById('f_id').value;
  if(!idVal) return;
  if(!confirm('Dieses Produkt wirklich entfernen?')) return;
  products = products.filter(p => p.id !== parseInt(idVal, 10));
  render();
  closeModal();
  await saveProducts();
}

loadProducts();
</script>
