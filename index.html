<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsere Wohnung – Galerie</title>
<style>
  :root{
    --bg:#faf9f7; --card:#ffffff; --ink:#1c1b19; --muted:#78736c;
    --line:#e6e2dc; --accent:#7d6a55; --warn:#a8443a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161513; --card:#201f1c; --ink:#f2efea; --muted:#9c968d;
           --line:#332f2a; --accent:#c4a882; --warn:#e08b80; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:32px 20px 64px;
  }
  header{max-width:1200px;margin:0 auto 40px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
  h1{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:0 0 8px}
  .sub{color:var(--muted);font-size:14px;max-width:60ch;margin:0}
  .btn-bar{display:flex;gap:10px;flex-wrap:wrap}
  .addbtn{
    flex-shrink:0;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px 18px;font-size:14px;font-weight:650;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .12s ease, opacity .12s ease;
  }
  .addbtn:hover{transform:translateY(-1px);opacity:.92}
  h2{
    max-width:1200px;margin:48px auto 16px;font-size:14px;font-weight:650;
    letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
    border-bottom:1px solid var(--line);padding-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .cat-title-wrap{display:flex;align-items:center;gap:8px}
  .cat-edit-btn{
    background:none;border:none;cursor:pointer;font-size:13px;padding:2px 6px;
    border-radius:4px;color:var(--muted);transition:color .12s ease, background .12s ease;
  }
  .cat-edit-btn:hover{color:var(--ink);background:var(--line)}
  h2 .count{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
  .grid{
    max-width:1200px;margin:0 auto;display:grid;gap:18px;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  }
  .cardwrap{position:relative}
  .card{
    display:flex;flex-direction:column;height:100%;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    cursor:pointer;color:inherit;transition:transform .16s ease, box-shadow .16s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.10)}
  .thumb{
    position:relative;aspect-ratio:1/1;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;padding:8px}
  .noimg{
    color:var(--muted);font-size:12px;text-align:center;padding:16px;line-height:1.45;
    background:repeating-linear-gradient(45deg,transparent,transparent 8px,rgba(125,106,85,.05) 8px,rgba(125,106,85,.05) 16px);
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  }
  .meta{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px}
  .name{font-size:13px;font-weight:560;line-height:1.35}
  .price{font-size:14px;font-weight:680;letter-spacing:-.01em}
  .price small{font-weight:400;color:var(--muted);text-decoration:line-through;margin-left:5px;font-size:12px}
  .badge{
    position:absolute;top:8px;left:8px;background:var(--warn);color:#fff;
    font-size:10px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 7px;border-radius:5px;
  }
  .pick{
    position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;
    font-size:10px;font-weight:650;padding:3px 7px;border-radius:5px;
  }
  footer{max-width:1200px;margin:56px auto 0;color:var(--muted);font-size:12px;
    border-top:1px solid var(--line);padding-top:16px}

  .overlay{
    position:fixed;inset:0;background:rgba(20,18,15,.5);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:10;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--card);border-radius:14px;max-width:520px;width:100%;
    padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto;
  }
  .modal h3{margin:0 0 18px;font-size:18px;font-weight:650}
  .modal-preview{
    width:100%;height:140px;object-fit:contain;background:#fff;border-radius:8px;
    margin-bottom:16px;border:1px solid var(--line);
  }
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.04em}
  .field input, .field select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  
  .url-input-group{display:flex;gap:8px}
  .fetch-btn{
    flex-shrink:0;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    transition:background .12s ease;
  }
  .fetch-btn:hover{background:var(--line)}
  
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modalbtns{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
  .modalbtns-right{display:flex;gap:10px}
  .btn{padding:10px 18px;border-radius:9px;border:none;font-size:14px;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
  .btn.shoplink{background:#2a2825;color:#fff}
  .empty{max-width:1200px;margin:0 auto;color:var(--muted);font-size:14px;padding:20px 0}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="pageHeading">Unsere Wohnung – Galerie</h1>
    <p class="sub">Live synchronisiert. Alle Änderungen sind sofort auf allen Geräten sichtbar.</p>
  </div>
  <div class="btn-bar">
    <button class="addbtn" onclick="openAddModal()">+ Produkt hinzufügen</button>
  </div>
</header>

<div id="content"><p class="empty">Lade Produkte...</p></div>
<footer id="footer"></footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Produkt bearbeiten</h3>
    <img id="modalImgPreview" class="modal-preview" src="" alt="Vorschau" style="display:none">
    
    <form id="productForm">
      <input type="hidden" id="f_id">
      
      <div class="field">
        <label>Link zum Shop</label>
        <div class="url-input-group">
          <input type="url" id="f_url" required placeholder="https://..." onpaste="handleUrlPaste(event)">
          <button type="button" class="fetch-btn" id="btnAutoFetch" onclick="fetchProductData()">✨ Abrufen</button>
        </div>
      </div>

      <div class="field">
        <label>Kategorie</label>
        <select id="f_category"></select>
      </div>
      <div class="field" id="newCatField" style="display:none">
        <label>Name der neuen Kategorie</label>
        <input type="text" id="f_newCategory" placeholder="z. B. Balkon, Flur">
      </div>

      <div class="field">
        <label>Produktname</label>
        <input type="text" id="f_name" required placeholder="z. B. IKEA MALM Kommode">
      </div>

      <div class="field">
        <label>Bild-URL (optional)</label>
        <input type="url" id="f_img" placeholder="https://..." oninput="updatePreview(this.value)">
      </div>

      <div class="row2">
        <div class="field">
          <label>Preis</label>
          <input type="text" id="f_price" placeholder="z. B. 199,00 €">
        </div>
        <div class="field">
          <label>Alter Preis (optional)</label>
          <input type="text" id="f_oldPrice" placeholder="z. B. 249 €">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Badge (optional)</label>
          <input type="text" id="f_badge" placeholder="z. B. ausverkauft">
        </div>
        <div class="field">
          <label>Label (optional)</label>
          <input type="text" id="f_pick" placeholder="z. B. Favorit">
        </div>
      </div>

      <div class="modalbtns">
        <div>
          <button type="button" class="btn danger" id="btnDelete" onclick="deleteCurrentProduct()" style="display:none">Löschen</button>
        </div>
        <div class="modalbtns-right">
          <a href="#" target="_blank" rel="noopener" class="btn shoplink" id="btnShopLink" style="display:none">Zum Shop ↗</a>
          <button type="button" class="btn ghost" onclick="closeModal()">Schließen</button>
          <button type="submit" class="btn primary" id="btnSubmit">Speichern</button>
        </div>
      </div>
    </form>
  </div>
</div>

const urlParams = new URLSearchParams(window.location.search);
const listId = urlParams.get('wg') || 'standard';

if(listId !== 'standard'){
  document.getElementById('pageHeading').textContent = `Wohnungsgalerie (${listId})`;
  document.title = `Wohnungsgalerie – ${listId}`;
}

const STORAGE_ENDPOINT = `${DB_URL}/lists/${encodeURIComponent(listId)}.json`;

let products = [];
let nextId = 1;

async function loadProducts(){
  try {
    const res = await fetch(STORAGE_ENDPOINT);
    const data = await res.json();
    if(data && Array.isArray(data) && data.length){
      products = data.filter(Boolean);
    } else if(listId === 'standard') {
      // Wenn die Standard-Liste leer ist, mit den alten Daten initialisieren
      products = SEED_PRODUCTS;
      await saveProducts();
    } else {
      products = [];
    }
  } catch(e) {
    products = listId === 'standard' ? SEED_PRODUCTS : [];
  }
  nextId = products.reduce((m,p)=>Math.max(m,p.id||0),0) + 1;
  render();
}

async function saveProducts(){
  try {
    await fetch(STORAGE_ENDPOINT, {
      method: 'PUT',
      body: JSON.stringify(products)
    });
  } catch(e) {
    console.error('Cloud Sync fehlgeschlagen', e);
  }
}

function updatePreview(url){
  const preview = document.getElementById('modalImgPreview');
  if(url && url.startsWith('http')){
    preview.src = url;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

function handleUrlPaste(e){
  setTimeout(() => {
    fetchProductData();
  }, 100);
}

async function fetchProductData(){
  const url = document.getElementById('f_url').value.trim();
  if(!url || !url.startsWith('http')) return;
  if(PROXY_URL.includes("DEINE_ID")){
    return;
  }

  const btn = document.getElementById('btnAutoFetch');
  btn.textContent = '⏳ Lädt...';
  btn.disabled = true;

  try {
    const res = await fetch(`${PROXY_URL}?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    
    if(data.title && !document.getElementById('f_name').value){
      document.getElementById('f_name').value = data.title;
    }
    if(data.image && !document.getElementById('f_img').value){
      document.getElementById('f_img').value = data.image;
      updatePreview(data.image);
    }
    if(data.price && !document.getElementById('f_price').value){
      document.getElementById('f_price').value = data.price;
    }
  } catch(err) {
    console.error("Scraping-Fehler", err);
  } finally {
    btn.textContent = '✨ Abrufen';
    btn.disabled = false;
  }
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const content = document.getElementById('content');
  if(products.length === 0){
    content.innerHTML = '<p class="empty">Noch keine Produkte in dieser Liste. Klicke oben auf "+ Produkt hinzufügen".</p>';
    document.getElementById('footer').textContent = '';
    return;
  }
  const categories = [];
  for(const p of products){
    if(p.category && !categories.includes(p.category)) categories.push(p.category);
  }
  let html = '';
  for(const cat of categories){
    const items = products.filter(p => p.category === cat);
    html += `<h2>
      <span class="cat-title-wrap">
        <span>${escapeHtml(cat)}</span>
        <button class="cat-edit-btn" onclick="renameCategory('${escapeHtml(cat)}')" title="Kategorie umbenennen">✏️</button>
      </span>
      <span class="count">${items.length} ${items.length===1?'Produkt':'Produkte'}</span>
    </h2>`;
    html += '<div class="grid">';
    for(const p of items){
      html += '<div class="cardwrap">';
      html += `<div class="card" onclick="openEditModal(${p.id})">`;
      html += '<div class="thumb">';
      if(p.badge) html += `<span class="badge">${escapeHtml(p.badge)}</span>`;
      if(p.pick) html += `<span class="pick">${escapeHtml(p.pick)}</span>`;
      if(p.img){
        html += `<img loading="lazy" src="${escapeHtml(p.img)}" alt="">`;
      } else {
        html += `<div class="noimg">${escapeHtml(p.noimg || 'Kein Bild hinterlegt')}</div>`;
      }
      html += '</div>';
      html += '<div class="meta">';
      html += `<span class="name">${escapeHtml(p.name)}</span>`;
      html += `<span class="price">${escapeHtml(p.price)}`;
      if(p.oldPrice) html += `<small>${escapeHtml(p.oldPrice)}</small>`;
      html += '</span></div></div></div>';
    }
    html += '</div>';
  }
  content.innerHTML = html;
  document.getElementById('footer').textContent =
    `${products.length} Produkte in ${categories.length} Kategorien.`;
}

async function renameCategory(oldName){
  const newName = prompt(`Kategorie "${oldName}" umbenennen in:`, oldName);
  if(!newName || newName.trim() === '' || newName.trim() === oldName) return;

  const trimmed = newName.trim();
  products = products.map(p => {
    if(p.category === oldName){
      return { ...p, category: trimmed };
    }
    return p;
  });

  render();
  await saveProducts();
}

function populateCategorySelect(selectedCategory = ''){
  const sel = document.getElementById('f_category');
  const categories = [];
  for(const p of products){
    if(p.category && !categories.includes(p.category)) categories.push(p.category);
  }
  sel.innerHTML = '';
  for(const c of categories){
    const opt = document.createElement('option');
    opt.value = c; 
    opt.textContent = c;
    if(c === selectedCategory) opt.selected = true;
    sel.appendChild(opt);
  }
  const newOpt = document.createElement('option');
  newOpt.value = '__new__'; 
  newOpt.textContent = '+ Neue Kategorie erstellen...';
  sel.appendChild(newOpt);
  
  sel.onchange = () => {
    document.getElementById('newCatField').style.display = sel.value === '__new__' ? 'block' : 'none';
  };
}

function openAddModal(){
  populateCategorySelect();
  document.getElementById('productForm').reset();
  document.getElementById('f_id').value = '';
  document.getElementById('modalTitle').textContent = 'Neues Produkt hinzufügen';
  document.getElementById('btnSubmit').textContent = 'Hinzufügen';
  document.getElementById('btnDelete').style.display = 'none';
  document.getElementById('btnShopLink').style.display = 'none';
  document.getElementById('modalImgPreview').style.display = 'none';
  document.getElementById('newCatField').style.display = 'none';
  document.getElementById('overlay').classList.add('open');
}

function openEditModal(id){
  const p = products.find(item => item.id === id);
  if(!p) return;
  populateCategorySelect(p.category);
  document.getElementById('productForm').reset();
  document.getElementById('f_id').value = p.id;
  document.getElementById('modalTitle').textContent = 'Produkt bearbeiten';
  document.getElementById('btnSubmit').textContent = 'Speichern';
  document.getElementById('btnDelete').style.display = 'inline-flex';
  
  const shopBtn = document.getElementById('btnShopLink');
  shopBtn.style.display = 'inline-flex';
  shopBtn.href = p.url;

  updatePreview(p.img);

  document.getElementById('f_name').value = p.name || '';
  document.getElementById('f_url').value = p.url || '';
  document.getElementById('f_img').value = p.img || '';
  document.getElementById('f_price').value = p.price || '';
  document.getElementById('f_oldPrice').value = p.oldPrice || '';
  document.getElementById('f_badge').value = p.badge || '';
  document.getElementById('f_pick').value = p.pick || '';
  document.getElementById('newCatField').style.display = 'none';

  document.getElementById('overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeModal();
});

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const catSel = document.getElementById('f_category').value;
  const category = catSel === '__new__'
    ? (document.getElementById('f_newCategory').value.trim() || 'Sonstiges')
    : catSel;
  const idVal = document.getElementById('f_id').value;

  const productData = {
    category,
    name: document.getElementById('f_name').value.trim(),
    url: document.getElementById('f_url').value.trim(),
    img: document.getElementById('f_img').value.trim(),
    noimg: '',
    price: document.getElementById('f_price').value.trim(),
    oldPrice: document.getElementById('f_oldPrice').value.trim(),
    badge: document.getElementById('f_badge').value.trim(),
    pick: document.getElementById('f_pick').value.trim(),
  };

  if(idVal){
    const idx = products.findIndex(p => p.id === parseInt(idVal, 10));
    if(idx !== -1){
      products[idx] = { ...products[idx], ...productData };
    }
  } else {
    productData.id = nextId++;
    products.push(productData);
  }

  render();
  closeModal();
  await saveProducts();
});

async function deleteCurrentProduct(){
  const idVal = document.getElementById('f_id').value;
  if(!idVal) return;
  if(!confirm('Dieses Produkt wirklich entfernen?')) return;
  products = products.filter(p => p.id !== parseInt(idVal, 10));
  render();
  closeModal();
  await saveProducts();
}

loadProducts();
</script>
